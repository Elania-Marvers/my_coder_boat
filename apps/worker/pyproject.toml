[project]
name = "local-qwen-worker"
version = "0.1.0"
description = "Worker local chargé de communiquer avec Ollama"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.6,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_qwen_worker"]
