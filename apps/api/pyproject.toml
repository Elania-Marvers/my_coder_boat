[project]
name = "local-qwen-api"
version = "0.1.0"
description = "Future API FastAPI de coordination"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "local-qwen-worker",
]

[tool.uv]
package = false

[tool.uv.sources]
local-qwen-worker = { workspace = true }

